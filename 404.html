<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Page Not Found | FY PromoGifts</title>
  <meta name="description" content="The requested FY PromoGifts page could not be found. Browse our product catalog, Kit Studio or custom gift solutions.">
  <style>
    :root {
      --navy: #071724;
      --cream: #f6efe6;
      --gold: #d99b38;
      --gold-light: #f0bf68;
      --ink: #0b2034;
      --muted: #68778a;
      --border: rgba(11, 32, 52, .14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      color: var(--ink);
      background: var(--cream);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main {
      width: min(720px, 100%);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: #fffaf3;
      box-shadow: 0 18px 42px rgba(7, 23, 36, .1);
      text-align: center;
    }
    .logo {
      display: inline-block;
      margin-bottom: 28px;
      color: var(--navy);
      font: 700 28px Georgia, "Times New Roman", serif;
      text-decoration: none;
    }
    .logo span { color: var(--gold); font-size: 36px; }
    .code {
      margin: 0 0 8px;
      color: #b98228;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 18px;
      font: 700 clamp(40px, 7vw, 62px)/1.05 Georgia, "Times New Roman", serif;
    }
    p {
      max-width: 560px;
      margin: 0 auto 28px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border: 1px solid rgba(217, 155, 56, .35);
      border-radius: 12px;
      color: var(--ink);
      background: #fff;
      font-weight: 800;
      text-decoration: none;
    }
    .button-primary {
      border-color: transparent;
      background: linear-gradient(180deg, var(--gold-light), var(--gold));
    }
    .button:focus-visible {
      outline: 3px solid rgba(217, 155, 56, .45);
      outline-offset: 3px;
    }
    @media (max-width: 520px) {
      nav { display: grid; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <a class="logo" href="/"><span>FY</span> PromoGifts</a>
    <p class="code">404 / Page not found</p>
    <h1>This page is no longer here.</h1>
    <p>The link may be outdated or the address may be incorrect. Continue with our current product and gift kit resources.</p>
    <nav aria-label="Helpful links">
      <a class="button button-primary" href="/">Return Home</a>
      <a class="button" href="/catalog/">Online Catalog</a>
      <a class="button" href="/kit-studio/">Kit Studio</a>
    </nav>
  </main>
</body>
</html>
