<!doctype html><html lang="en"><head>  <meta charset="utf-8">  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">  <meta name="robots" content="index,follow">  <title>Kit Studio | Build Branded Gift Kits | FY PromoGifts</title>  <meta name="description" content="Use FY PromoGifts Kit Studio to choose a branded gift kit by occasion, color direction, budget and quantity, then request a custom quote.">  <link rel="canonical" href="https://www.fypromogifts.com/kit-studio/">  <link rel="stylesheet" href="../assets/kit-studio-luxe.css?v=20260617-lean-results">  <link rel="preload" as="image" href="../assets/kit-studio-final/employee-onboarding-kits-confirmed.jpg">  <link rel="preload" as="image" href="../assets/kit-studio-final/client-appreciation-gifts-confirmed.jpg">  <link rel="preload" as="image" href="../assets/kit-studio-final/trade-show-event-kits-confirmed.jpg">  <script src="../data/kit-data.js"></script><style>.sticky-contact-wa,.sticky-contact-quote{position:fixed!important;z-index:2147483000!important;text-decoration:none!important}.sticky-contact-wa{left:28px!important;bottom:28px!important;width:64px!important;height:64px!important;border-radius:50%!important;display:grid!important;place-items:center!important;background:#25D366!important;box-shadow:0 14px 30px rgba(37,211,102,.34),0 0 0 8px rgba(37,211,102,.12)!important;transition:transform .2s ease,box-shadow .2s ease!important}.sticky-contact-wa:hover,.sticky-contact-quote:hover{transform:translateY(-2px)!important}.sticky-contact-wa svg{width:40px!important;height:40px!important;display:block!important}.sticky-contact-quote{right:28px!important;bottom:28px!important;min-height:52px!important;padding:0 24px!important;border-radius:999px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:9px!important;background:linear-gradient(180deg,#f0bf68,#d99b38)!important;color:#1b1307!important;font-weight:950!important;font-size:15px!important;letter-spacing:.01em!important;box-shadow:0 16px 32px rgba(217,155,56,.32),0 0 0 8px rgba(217,155,56,.10)!important}.sticky-contact-quote svg{width:18px!important;height:18px!important;flex:0 0 auto!important}@media(max-width:720px){.sticky-contact-wa{left:14px!important;bottom:14px!important;width:56px!important;height:56px!important}.sticky-contact-wa svg{width:35px!important;height:35px!important}.sticky-contact-quote{right:14px!important;bottom:14px!important;min-height:46px!important;padding:0 16px!important;font-size:13px!important}}</style></head><body class="kit-framework">  <header class="site-bar">    <a href="../index.html">FY PromoGifts</a>    <span>Kit Studio</span>  </header>  <main class="page-shell">    <section class="wide-banner">      <span>Kit Studio</span>    </section>    <section class="result-head">      <div>        <span>Recommended from your answers</span>        <h1>Recommended kit concepts</h1>      </div>      <button type="button" id="retakeQuiz">Retake quiz</button>    </section>    <section class="recommendations" id="recommendations" aria-label="Recommended kits"></section>    <section class="full-strips">      <a href="../custom-products/?mode=free-build">None of these? Build your own kit from the product library.</a>      <a href="../index.html#contact">Or contact us directly. We will curate the kit for you.</a>    </section>  </main>  <div class="question-modal open" id="questionModal" aria-hidden="false">    <div class="question-card">      <div class="question-topline">        <span id="stepLabel">01 / 04</span>        <div class="question-nav">          <button type="button" id="backQuestion">Back</button>          <button type="button" id="skipQuestions">Skip</button>        </div>      </div>      <section class="question-step active" id="questionStep"></section>    </div>  </div>  <div class="quote-modal" id="quoteModal" aria-hidden="true">    <form class="quote-card" id="quoteForm" action="https://formspree.io/f/xgoqqrno" method="POST" enctype="multipart/form-data">      <div class="quote-card__head">        <div>          <p class="kicker">Send kit idea</p>          <h2 id="quoteTitle">Kit inquiry</h2>        </div>        <button type="button" id="closeQuote">Close</button>      </div>      <input type="hidden" name="_subject" value="New Kit Studio Inquiry - FY PromoGifts">      <input type="hidden" name="use_case" id="quoteUseCase">      <input type="hidden" name="products" id="quoteProducts">      <div class="quote-grid">        <label>Name<input name="name" required></label>        <label>Email<input name="email" type="email" required></label>        <label>WhatsApp<input name="whatsapp"></label>        <label>Company<input name="company"></label>        <label>Estimated quantity<input name="quantity" placeholder="e.g. 300 sets"></label>        <label>Need-by date<input name="need_by_date" placeholder="YYYY-MM-DD"></label>        <label class="quote-wide">Logo / artwork<input name="logoUpload" type="file" accept=".jpg,.jpeg,.png,.pdf,.ai,.eps"></label>        <label class="quote-wide">Message<textarea name="message" id="quoteMessage"></textarea></label>      </div>      <button class="quote-submit" type="submit">Submit kit inquiry</button>      <p class="quote-status" id="quoteStatus"></p>    </form>  </div>  <script>    const data = window.FY_KIT_DATA;    const modal = document.getElementById("questionModal");    const stepLabel = document.getElementById("stepLabel");    const questionStep = document.getElementById("questionStep");    const backButton = document.getElementById("backQuestion");    const recommendations = document.getElementById("recommendations");    const quoteModal = document.getElementById("quoteModal");    const quoteForm = document.getElementById("quoteForm");    const quoteTitle = document.getElementById("quoteTitle");    const quoteUseCase = document.getElementById("quoteUseCase");    const quoteProducts = document.getElementById("quoteProducts");    const quoteMessage = document.getElementById("quoteMessage");    const quoteStatus = document.getElementById("quoteStatus");    const answers = {};    let index = 0;    function preloadKitImages(){      const urls = new Set();      data.kits.forEach((kit) => {        if (kit.heroImage) urls.add(kit.heroImage);        if (kit.visuals) Object.values(kit.visuals).forEach((url) => urls.add(url));        kit.products.forEach((product) => urls.add(product.image));      });      urls.forEach((url) => {        const image = new Image();        image.decoding = "async";        image.src = url;      });    }    function renderQuestion(){      const question = data.questions[index];      stepLabel.textContent = `${String(index + 1).padStart(2, "0")} / ${String(data.questions.length).padStart(2, "0")}`;      backButton.disabled = index === 0;      questionStep.innerHTML = `        <p class="kicker">${question.kicker}</p>        <h2>${question.title}</h2>        <div class="choice-grid">          ${question.options.map((option) => `            <button type="button" data-value="${option.value}">              <strong>${option.label}</strong>              <span>${option.note}</span>            </button>          `).join("")}        </div>      `;      questionStep.querySelectorAll("button").forEach((button) => {        button.addEventListener("click", () => {          answers[question.id] = button.dataset.value;          if (index < data.questions.length - 1) {            index += 1;            renderQuestion();          } else {            closeQuiz();            renderRecommendations();          }        });      });    }    function scoreKit(kit){      let score = 0;      if (answers.useCase && kit.tags.includes(answers.useCase)) score += 100;      if (answers.color && answers.color !== "match-scene" && kit.tags.includes(answers.color)) score += 12;      if (answers.budget && kit.tags.includes(answers.budget)) score += 6;      if (answers.quantity && kit.tags.includes(answers.quantity)) score += 4;      return score;    }    function topKits(){      return [...data.kits]        .map((kit) => ({ kit, score: scoreKit(kit) }))        .sort((a, b) => b.score - a.score || data.kits.indexOf(a.kit) - data.kits.indexOf(b.kit))        .slice(0, 3)        .map((entry) => entry.kit);    }    function kitVisual(kit){      const color = answers.color;      if (kit.visuals && color && kit.visuals[color]) return kit.visuals[color];      if (kit.visuals && kit.visuals.default) return kit.visuals.default;      return kit.heroImage;    }    function visualLabel(kit){      const color = answers.color;      if (kit.visuals && color && kit.visuals[color]) return color.replace("-", " ");      return "suggested";    }    function renderRecommendations(){      recommendations.innerHTML = topKits().map((kit, kitIndex) => `        <article class="kit-row">          <div class="kit-image kit-image--${kit.visual}">            <img src="${kitVisual(kit)}" alt="${kit.imageAlt}" loading="eager" decoding="async" fetchpriority="${kitIndex === 0 ? "high" : "auto"}">            <span>Kit 0${kitIndex + 1}</span>            <em>${visualLabel(kit)} visual</em>            <button type="button" class="quote-chip" data-kit="${kit.id}">Send This Kit Idea</button>          </div>          <div class="kit-actions">            <div class="kit-label">Recommendation 0${kitIndex + 1}</div>            <h2>${kit.name}</h2>            <p>${kit.reason}</p>            <div class="product-strip">              ${kit.products.map((product) => `                <figure>                  <img src="${product.image}" alt="${product.name}" loading="lazy" decoding="async">                  <figcaption>${product.name}</figcaption>                </figure>              `).join("")}            </div>            <div class="kit-includes"><span>Suggested mix</span>${kit.items.join(" / ")}</div>            <details class="kit-details">              <summary>Customization details</summary>              <div class="detail-block">                <span>Printable logo areas</span>                <p>${kit.logoAreas.join(", ")}</p>              </div>              <div class="detail-block">                <span>Logo methods</span>                <p>${kit.logoMethods}</p>              </div>              <div class="detail-block">                <span>Packaging options</span>                <p>${kit.packaging}</p>              </div>            </details>            <p class="kit-note">${kit.note} Final products, colors and packaging can be adjusted before quote.</p>            <div class="kit-cta-row">              <button type="button" data-kit="${kit.id}">Send this kit idea</button>              <a href="../custom-products/?mode=swap&kit=${kit.id}">Customize products</a>            </div>          </div>        </article>      `).join("");      recommendations.querySelectorAll("[data-kit]").forEach((button) => {        button.addEventListener("click", () => openQuote(button.dataset.kit));      });    }    function kitSummary(kit){      return [        `${kit.name}`,        `Products: ${kit.items.join(", ")}`,        `MOQ: ${kit.moq}`,        `Budget: ${kit.budget}`,        `Logo methods: ${kit.logoMethods}`,        `Packaging: ${kit.packaging}`,        `Sample time: ${kit.sampleTime}`,        `Production time: ${kit.productionTime}`      ].join("\n");    }    function openQuote(kitId){      const kit = data.kits.find((entry) => entry.id === kitId);      if (!kit) return;      quoteTitle.textContent = kit.name;      quoteUseCase.value = kit.name;      quoteProducts.value = kit.items.join(", ");      quoteMessage.value = `Please quote this Kit Studio idea:\n\n${kitSummary(kit)}\n\nMy notes:`;      quoteStatus.textContent = "";      quoteModal.classList.add("open");      quoteModal.setAttribute("aria-hidden", "false");      quoteForm.querySelector("input[name='name']").focus();    }    function closeQuote(){      quoteModal.classList.remove("open");      quoteModal.setAttribute("aria-hidden", "true");    }    function openQuiz(){      index = 0;      Object.keys(answers).forEach((key) => delete answers[key]);      modal.classList.add("open");      modal.setAttribute("aria-hidden", "false");      renderQuestion();    }    function closeQuiz(){      modal.classList.remove("open");      modal.setAttribute("aria-hidden", "true");    }    backButton.addEventListener("click", () => {      if (index > 0) {        index -= 1;        renderQuestion();      }    });    document.getElementById("skipQuestions").addEventListener("click", () => {      closeQuiz();      renderRecommendations();    });    document.getElementById("retakeQuiz").addEventListener("click", openQuiz);    document.getElementById("closeQuote").addEventListener("click", closeQuote);    quoteModal.addEventListener("click", (event) => {      if (event.target === quoteModal) closeQuote();    });    quoteForm.addEventListener("submit", async (event) => {      event.preventDefault();      quoteStatus.textContent = "Submitting...";      try {        const response = await fetch(quoteForm.action, {          method: "POST",          body: new FormData(quoteForm),          headers: { Accept: "application/json" }        });        quoteStatus.textContent = response.ok          ? "Thanks. Your kit idea has been sent."          : "Submission failed. Please email sira@fypromogifts.com.";        if (response.ok) quoteForm.reset();      } catch (error) {        quoteStatus.textContent = "Submission failed. Please email sira@fypromogifts.com.";      }    });    renderQuestion();    renderRecommendations();    preloadKitImages();  </script><script>(function(){function clean(value){return String(value||"").replace(/\s+/g," ").trim().slice(0,120)}function track(name,params){var payload=Object.assign({event:name,page_path:location.pathname,page_title:document.title},params||{});window.dataLayer=window.dataLayer||[];window.dataLayer.push(payload);if(typeof window.gtag==="function"){window.gtag("event",name,payload)}if(typeof window.clarity==="function"){window.clarity("event",name)}if(window.zaraz&&typeof window.zaraz.track==="function"){window.zaraz.track(name,payload)}window.dispatchEvent(new CustomEvent("fy:track",{detail:{name:name,params:payload}}))}window.fyTrack=track;track("kit_studio_view");document.addEventListener("click",function(event){var target=event.target.closest("a,button");if(!target)return;var href=target.getAttribute("href")||"";var text=clean(target.textContent||target.id);if(target.hasAttribute("data-kit")){track("kit_quote_click",{kit_id:target.getAttribute("data-kit"),link_text:text})}if(target.id==="skipQuestions"){track("kit_quiz_skip")}if(target.id==="retakeQuiz"){track("kit_quiz_retake")}if(href.indexOf("custom-products")>-1){track("kit_customize_click",{link_url:href})}if(href.indexOf("#contact")>-1){track("contact_cta_click",{link_url:href,link_text:text})}},true);var form=document.getElementById("quoteForm");if(form){var started=false;form.addEventListener("input",function(){if(started)return;started=true;track("kit_form_start")},true);form.addEventListener("submit",function(){track("kit_form_submit_attempt")},true)}var status=document.getElementById("quoteStatus");if(status&&window.MutationObserver){var sent=false;new MutationObserver(function(){if(sent)return;var text=status.textContent||"";if(text.indexOf("Thanks")>-1||text.indexOf("sent")>-1){sent=true;track("kit_form_submit_success")}}).observe(status,{childList:true,subtree:true,characterData:true})}})();</script><script id="fy-sticky-contact-v3">
